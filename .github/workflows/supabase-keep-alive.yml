name: Supabase Keep-Alive

on:
  schedule:
    # 매 3일마다 실행 (UTC 00:00, 한국시간 09:00)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    name: Ping Vercel Cron Endpoint to trigger Supabase DB Activity

    steps:
      - name: Ping AI-Flow Vercel Keep-Alive Endpoint
        shell: bash
        run: |
          echo "🔔 Triggering Supabase DB Activity via AI-Flow Vercel Cron..."
          set +e
          # Vercel에 배포된 keep-alive API를 호출하여 실제 서비스 롤 키로 Supabase DB 조회를 일으킵니다.
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 30 \
            "https://ai-flow.vercel.app/api/cron/keep-alive")
          curl_exit=$?
          set -e
          
          http_code=$(echo "$response" | tr -d '\r' | grep "HTTP_STATUS:" | sed 's/HTTP_STATUS://')
          body=$(echo "$response" | tr -d '\r' | grep -v "HTTP_STATUS:")
          
          echo "Curl Exit Code: $curl_exit"
          echo "HTTP Response Code: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" = "200" ]; then
            echo "✅ AI-Flow Keep-Alive Succeeded! DB traffic generated."
          else
            echo "⚠️ AI-Flow Keep-Alive returned non-200. Checking backup..."
          fi

      - name: Log keep-alive completion
        run: echo "✅ Keep-alive workflow finished at $(date '+%Y-%m-%d %H:%M:%S UTC')"
