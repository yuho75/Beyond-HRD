name: Supabase Keep-Alive

on:
  schedule:
    # 매 6일마다 실행 (UTC 00:00, 한국시간 09:00)
    - cron: '0 0 */6 * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    name: Ping Supabase (Beyond-HRD) to prevent pausing

    steps:
      - name: Ping Supabase Health Endpoint
        shell: bash
        run: |
          echo "🔔 Pinging Supabase Beyond-HRD: cvzzywvvglnlotqgdpfq"
          set +e
          http_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://cvzzywvvglnlotqgdpfq.supabase.co/health")
          curl_exit=$?
          set -e
          echo "HTTP Response: $http_code (curl exit code: $curl_exit)"
          if [ "$http_code" = "200" ] || [ "$http_code" = "401" ] || [ "$http_code" = "404" ]; then
            echo "✅ Supabase Beyond-HRD is alive!"
          else
            echo "❌ Cannot reach Supabase (code: $http_code, curl exit: $curl_exit)"
            exit 1
          fi

      - name: Log timestamp
        run: echo "✅ Keep-alive ping completed at $(date '+%Y-%m-%d %H:%M:%S UTC')"
